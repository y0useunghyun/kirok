<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기록 중!</title>
<!-- Adobe Fonts: AG 안상수체 2012 (보물찾기와 같은 키트) -->
<script>
  (function(d) {
    var config = { kitId: 'tde8evh', scriptTimeout: 3000, async: true },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=40">
</head>
<body>
<main class="stage">
  <div id="paper" class="paper">
    <section id="intro" class="intro">
      <blockquote class="quote"><span id="quote"></span> <cite id="cite"></cite></blockquote>
      <p class="actions"><button type="button" class="kw" data-mode="text">글</button>을 적거나, <button type="button" class="kw" data-mode="draw">그림</button>을 그리거나, <button type="button" class="kw" data-pick="camera">사진</button>을 찍거나,<br><button type="button" class="kw" data-pick="file">앨범</button>에서 선택해 기록을 남겨주세요!</p>

      <p id="hint" class="hint" aria-live="polite"></p>
    </section>
  </div>
</main>

<div id="track" class="track" aria-hidden="true"><span id="thumb"></span></div>

<input id="camera" class="file-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input id="file" class="file-input" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

<form id="box" class="box" hidden>
  <div class="row modes">
    <button type="button" class="kw" data-mode="text">글</button>
    <button type="button" class="kw" data-mode="draw">그림</button>
    <button type="button" class="kw" data-pick="camera">사진</button>
    <button type="button" class="kw" data-pick="file">앨범</button>
  </div>

  <textarea id="text" maxlength="200" rows="2" placeholder="적기"></textarea>

  <div id="pad" class="pad" hidden>
    <canvas id="draw" aria-label="그리는 칸"></canvas>
    <button id="clear" type="button">지우기</button>
    <div id="colors" class="colors" role="radiogroup" aria-label="색"></div>
  </div>

  <div id="cam" class="cam" hidden>
    <video id="camVideo" playsinline muted></video>
    <button id="shoot" type="button">찍기</button>
  </div>

  <label id="sizer" class="sizer" hidden>
    <span>크기</span>
    <input id="size" type="range" min="0" max="100" value="50" aria-label="크기 (가운데 = 지금 크기)">
  </label>

  <p id="msg" class="msg" role="alert"></p>
  <div class="row">
    <span class="grow"><span id="dragHint" hidden>기록을 원하는 곳에 움직여 배치해주세요</span></span>
    <button id="cancel" type="button">취소</button>
    <button id="send" type="submit" disabled>남기기</button>
  </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js?v=40"></script>
<script src="core.js?v=40"></script>
<script src="store.js?v=40"></script>
<script src="app.js?v=40"></script>
</body>
</html>
